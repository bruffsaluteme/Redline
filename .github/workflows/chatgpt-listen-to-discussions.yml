name: ChatGPT Discussion Responder

on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

jobs:
  respond-to-discussion:
    if: github.event.action == 'created' || github.event.action == 'edited'
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get Discussion Context
        id: discussion
        run: |
          echo "discussion_title=${{ github.event.discussion.title }}" >> $GITHUB_OUTPUT
          echo "discussion_body=${{ github.event.discussion.body }}" >> $GITHUB_OUTPUT
          echo "discussion_category=${{ github.event.discussion.category.name }}" >> $GITHUB_OUTPUT

      - name: ChatGPT - Generate Response
        uses: KevinLiao/openai-completions-action@v3
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            A user has posted in the GitHub Discussion for the Redline project.
            
            DISCUSSION TITLE: ${{ steps.discussion.outputs.discussion_title }}
            CATEGORY: ${{ steps.discussion.outputs.discussion_category }}
            
            USER MESSAGE:
            ${{ steps.discussion.outputs.discussion_body }}
            
            Provide a helpful, professional response that:
            1. Addresses their concern/question directly
            2. Offers solutions or suggestions
            3. Invites further collaboration
            4. Keeps the conversation constructive
            
            Keep the response concise but helpful (2-4 paragraphs).
          model: "gpt-3.5-turbo"
        id: response

      - name: Post ChatGPT Response
        uses: actions/github-script@v6
        with:
          script: |
            const discussionId = '${{ github.event.discussion.node_id }}';
            const response = `${{ steps.response.outputs.completion }}`;
            
            const comment = `${response}\n\n---\n*Response generated by ChatGPT Project Manager with full repository access.*`;
            
            console.log('Discussion ID:', discussionId);
            console.log('Response posted successfully');
